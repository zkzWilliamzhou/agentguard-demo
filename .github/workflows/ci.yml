name: Demo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  agentguard-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install AgentGuard
      run: pip install agentguard

    - name: Run AgentGuard scan
      run: |
        agentguard scan . --format json --output scan-report.json
        echo "::set-output name=report::$(cat scan-report.json)"
    
    - name: Upload scan report
      uses: actions/upload-artifact@v4
      with:
        name: agentguard-report
        path: scan-report.json

    - name: Fail on critical issues
      run: |
        python -c "
import json
with open('scan-report.json') as f:
    data = json.load(f)
    if data.get('critical_issues', 0) > 0:
        print('CRITICAL ISSUES FOUND:')
        print(json.dumps(data.get('files', []), indent=2))
        exit(1)
    print('No critical issues found!')
"